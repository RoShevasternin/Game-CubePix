<script>window.__cubepixConsent = {"id":"G-SGZ9EJ8RJY","mode":"play","S":{"en":{"consent.title":"Help us make the game better","consent.text":"We're a two-person indie studio. May we count visits with Google Analytics? It shows us which pictures and floors you enjoy, so we know what to make next. No ad tracking, nothing sold.","consent.allow":"Allow","consent.decline":"Decline","consent.settings":"Cookie settings","foot.privacy":"Privacy policy"},"uk":{"consent.title":"Допоможи нам зробити гру кращою","consent.text":"Ми — інді-студія з двох людей. Можна рахувати відвідування через Google Analytics? Так ми бачимо, які картини й поверхи вам подобаються, і знаємо, що робити далі. Без рекламного стеження, нічого не продаємо.","consent.allow":"Дозволити","consent.decline":"Відхилити","consent.settings":"Налаштування cookie","foot.privacy":"Політика конфіденційності"},"id":{"consent.title":"Bantu kami membuat gim ini lebih baik","consent.text":"Kami studio indie berisi dua orang. Bolehkah kami menghitung kunjungan dengan Google Analytics? Ini menunjukkan lukisan dan lantai mana yang kamu suka, jadi kami tahu apa yang harus dibuat berikutnya. Tanpa pelacakan iklan, tidak ada yang dijual.","consent.allow":"Izinkan","consent.decline":"Tolak","consent.settings":"Pengaturan cookie","foot.privacy":"Kebijakan privasi"},"de":{"consent.title":"Hilf uns, das Spiel besser zu machen","consent.text":"Wir sind ein Indie-Studio aus zwei Leuten. Dürfen wir Besuche mit Google Analytics zählen? So sehen wir, welche Gemälde und Etagen dir gefallen, und wissen, was wir als Nächstes bauen. Kein Werbe-Tracking, es wird nichts verkauft.","consent.allow":"Erlauben","consent.decline":"Ablehnen","consent.settings":"Cookie-Einstellungen","foot.privacy":"Datenschutzerklärung"},"es":{"consent.title":"Ayúdanos a mejorar el juego","consent.text":"Somos un estudio indie de dos personas. ¿Podemos contar las visitas con Google Analytics? Nos muestra qué cuadros y pisos te encantan, así sabemos qué hacer d ":"Kuki ayarları","foot.privacy":"Məxfilik siyasəti"},"be":{"consent.title":"Дапамажы нам зрабіць гульню лепшай","consent.text":"Мы — індзі-студыя з двух чалавек. Можна лічыць наведванні праз Google Analytics? Так мы бачым, якія карціны і паверхі вам падабаюцца, і ведаем, што рабіць далей. Без рэкламнага сачэння, нічога не прадаём.","consent.allow":"Дазволіць","consent.decline":"Адхіліць","consent.settings":"Налады cookie","foot.privacy":"Палітыка прыватнасці"},"bg":{"consent.title":"Помогни ни да направим играта по-добра","consent.text":"Ние сме инди студио от двама души. Може ли да броим посещенията с Google Analytics? Така виждаме кои картини и етажи обичаш и знаем какво да направим следващо. Без рекламно проследяване, нищо не продаваме.","consent.allow":"Разреши","consent.decline":"Откажи","consent.settings":"Настройки за бисквитки","foot.privacy":"Политика за поверителност"},"bn":{"consent.title":"গেমটিকে আরও ভালো করতে আমাদের সাহায্য করো","consent.text":"আমরা দুজনের একটি ইন্ডি স্টুডিও। Google Analytics দিয়ে কি আমরা ভিজিট গুনতে পারি? এতে বুঝতে পারি তুমি কোন ছবি আর তলাগুলো ভালোবাসো, যাতে পরের বার কী বানাতে হবে জানি। বিজ্ঞাপনের ট্র্যাকিং নেই, কিছুই বিক্রি হয় না।","consent.allow":"অনুমতি দাও","consent.decline":"প্রত্যাখ্যান করো","consent.settings":"কুকি সেটিংস","foot.privacy":"প্রাইভেসি পলিসি"},"bs":{"consent.title":"Pomozi nam da igru učinimo boljom","consent.text":"Mi smo indie studio od dvije osobe. Smijemo li brojati posjete putem Google Analytics? Tako vidimo koje slike i spratove voliš, pa znamo šta dalje praviti. Bez praćenja radi reklama, ništa ne prodajemo.","consent.allow":"Dozvoli","consent.decline":"Odbij","consent.settings":"Postavke kolačića","foot.privacy":"Politika privatnosti"},"ca":{"consent.title":"Ajuda'ns a fer el joc millor","consent.text":"Som un estudi indie de dues persones. Podem comptar les visites amb Google Analytics? Ens mostra quins quadres i plantes t'encanten, així sabem què fer després. Sense seguiment publicitari, no venem res.","consent.allow":"Permet","consent.decline":"Rebutja","consent.settings":"Configuració de galetes","foot.privacy":"Política de privadesa"},"cs":{"consent.title":"Pomoz nám udělat hru lepší","consent.text":"Jsme dvoučlenné nezávislé studio. Můžeme počítat návštěvy pomocí Google Analytics? Ukáže nám, které obrazy a patra tě baví, takže víme, co vyrobit příště. Žádné sledování pro reklamu, nic neprodáváme.","consent.allow":"Povolit","consent.decline":"Odmítnout","consent.settings":"Nastavení cookies","foot.privacy":"Zásady ochrany osobních údajů"},"da":{"consent.title":"Hjælp os med at gøre spillet bedre","consent.text":"Vi er et indiestudie med to personer. Må vi tælle besøg med Google Analytics? Det viser os, hvilke malerier og etager du elsker, så vi ved, hvad vi skal lave næste gang. Ingen annoncesporing, intet bliver solgt.","consent.allow":"Tillad","consent.decline":"Afvis","consent.settings":"Cookieindstillinger","foot.privacy":"Privatlivspolitik"},"el":{"consent.title":"Βοήθησέ μας να κάνουμε το παιχνίδι καλύτερο","consent.text":"Είμαστε ένα ανεξάρτητο στούντιο δύο ατόμων. Μπορούμε να μετράμε τις επισκέψεις με το Google Analytics; Μας δείχνει ποιους πίνακες και ορόφους αγαπάς, ώστε να ξέρουμε τι να φτιάξουμε μετά. Χωρίς διαφημιστική παρακολούθηση, δεν πουλάμε τίποτα.","consent.allow":"Αποδοχή","consent.decline":"Απόρριψη","consent.settings":"Ρυθμίσεις cookie","foot.privacy":"Πολιτική απορρήτου"},"et":{"consent.title":"Aita meil mängu paremaks teha","consent.text":"Oleme kahe inimese indiistuudio. Kas tohime külastusi Google Analyticsiga lugeda? See näitab, millised maalid ja korrused sulle meeldivad, et teaksime, mida järgmisena teha. Reklaamijälgimist pole, midagi ei müüda.","consent.allow":"Luba","consent.decline":"Keeldu","consent.settings":"Küpsiste seaded","foot.privacy":"Privaatsuspoliitika"},"eu":{"consent.title":"Lagun iezaguzu jokoa hobetzen","consent.text":"Bi pertsonako estudio indie bat gara. Bisitak Google Analytics-ekin zenbatu ditzakegu? Zer marg title":"રમતને વધુ સારી બનાવવામાં અમારી મદદ કરો","consent.text":"અમે બે જણનો ઇન્ડી સ્ટુડિયો છીએ. શું અમે Google Analytics વડે મુલાકાતો ગણી શકીએ? તેનાથી ખબર પડે છે કે તમને કયા ચિત્રો અને માળ ગમે છે, જેથી આગળ શું બનાવવું તે અમે જાણી શકીએ. જાહેરાત માટે ટ્રેકિંગ નથી, કંઈ વેચાતું નથી.","consent.allow":"મંજૂરી આપ","consent.decline":"નકાર","consent.settings":"કૂકી સેટિંગ્સ","foot.privacy":"ગોપનીયતા નીતિ"},"ha":{"consent.title":"Ka taimaka mana mu inganta wasan","consent.text":"Mu ɗakin studiyo ne na indie na mutum biyu. Za mu iya ƙirga ziyara da Google Analytics? Yana nuna mana waɗanne zane-zane da benaye kake so, don mu san abin da za mu yi na gaba. Babu bin diddigin talla, ba mu sayar da komai.","consent.allow":"Yarda","consent.decline":"Ƙi","consent.settings":"Saitunan kukis","foot.privacy":"Manufar sirri"},"he":{"consent.title":"עזרו לנו לשפר את המשחק","consent.text":"אנחנו סטודיו עצמאי של שני אנשים. אפשר לספור ביקורים עם Google Analytics? זה מראה לנו אילו ציורים וקומות אתם אוהבים, ככה נדע מה ליצור הלאה. בלי מעקב פרסומי, ואנחנו לא מוכרים כלום.","consent.allow":"אישור","consent.decline":"דחייה","consent.settings":"הגדרות עוגיות","foot.privacy":"מדיניות פרטיות"},"hi":{"consent.title":"गेम को बेहतर बनाने में हमारी मदद करो","consent.text":"हम दो लोगों का एक इंडी स्टूडियो हैं। क्या हम Google Analytics से विज़िट गिन सकते हैं? इससे पता चलता है कि तुम्हें कौन-सी पेंटिंग्स और मंज़िलें पसंद हैं, ताकि हम जान सकें आगे क्या बनाना है। विज्ञापन के लिए कोई ट्रैकिंग नहीं, कुछ भी बेचा नहीं जाता।","consent.allow":"अनुमति दो","consent.decline":"मना करो","consent.settings":"कुकी सेटिंग्स","foot.privacy":"प्राइवेसी पॉलिसी"},"hr":{"consent.title":"Pomozi nam da igru učinimo boljom","consent.text":"Mi smo indie studio od dvoje ljudi. Smijemo li brojati posjete putem Google Analytics? Tako vidimo koje slike i katove voliš pa znamo što dalje napraviti. Bez praćenja za oglase, ništa ne prodajemo.","consent.allow":"Dopusti","consent.decline":"Odbij","consent.settings":"Postavke kolačića","foot.privacy":"Pravila o privatnosti"},"hu":{"consent.title":"Segíts, hogy jobbá tegyük a játékot","consent.text":"Egy kétfős indie stúdió vagyunk. Megszámolhatjuk a látogatásokat a Google Analyticsszel? Megmutatja, mely festményeket és emeleteket szereted, így tudjuk, mit készítsünk legközelebb. Nincs hirdetéskövetés, semmit sem adunk el.","consent.allow":"Engedélyezés","consent.decline":"Elutasítás","consent.settings":"Sütibeállítások","foot.privacy":"Adatvédelmi tájékoztató"},"hy":{"consent.title":"Օգնիր մեզ դարձնել խաղը ավելի լավը","consent.text":"Մենք երկու հոգանոց ինդի ստուդիա ենք։ Կարո՞ղ ենք հաշվել այցերը Google Analytics-ով։ Այն ցույց է տալիս՝ որ կտավներն ու հարկերն ես սիրում, որպեսզի իմանանք՝ հաջորդը ինչ պատրաստել։ Ոչ մի գովազդային հետևում, ոչինչ չենք վաճառում։","consent.allow":"Թույլատրել","consent.decline":"Մերժել","consent.settings":"Քուքիների կարգավորումներ","foot.privacy":"Գաղտնիության քաղաքականություն"},"ig":{"consent.title":"Nyere anyị aka ime ka egwuregwu a dịkwuo mma","consent.text":"Anyị bụ studio indie nke mmadụ abụọ. Anyị nwere ike ịgụta nleta site na Google Analytics? Ọ na-egosi anyị ihe osise na okpukpu ndị ị hụrụ n'anya, ka anyị mara ihe anyị ga-eme n'ọdịnihu. Enweghị nsochi mgbasa ozi, anyị adịghị ere ihe ọbụla.","consent.allow":"Kwe","consent.decline":"Jụ","consent.settings":"Ntọala kuki","foot.privacy":"Iwu nzuzo"},"is":{"consent.title":"Hjálpaðu okkur að gera leikinn betri","consent.text":"Við erum tveggja manna indie-stúdíó. Megum við telja heimsóknir með Google Analytics? Það sýnir okkur hvaða málverk og hæðir þú elskar svo við vitum hvað við eigum að gera næst. Engin auglýsingarakning, ekkert er selt.","consent.allow":"Leyfa","consent.decline":"Hafna","consent.settings":"Vafrakökustillingar","foot.privacy":"Persónuverndarstefna"},"ka":{"consent.title":"დაგვეხმარე, თამაში უკეთესი გავხადოთ","consent.text":"ჩვენ ორკაციანი ინდი სტუდია ვართ. შეგვიძლია ვიზიტები Google Analytics-ით დავთვალოთ? ის გვიჩვენებს, რომელი ნახატები და სართულები გიყვარს, რომ ვიცოდეთ, შემდეგ რა გავაკეთოთ. რეკლამისთვის თვალთვალი არ არის, არაფერს ვყიდით.","consent.allow":"დაშვება","consent.decline":"უარყოფა","consent.settings":"ქუქიების პარამეტრები","foot.privacy":"კონფიდენციალურობის პოლიტიკა"},"kk":{"consent.title":"Ойынды жақсартуға көмектес","consent.text":"Біз екі адамнан тұратын инди-студиямыз. Кіруді Google Analytics арқылы санауға бола ма? Ол сенің қандай суреттер мен қабаттарды ұнататыныңды көрсетеді, сонда келесіде не жасайтынымызды білеміз. Жарнамалық бақылау жоқ, ештеңе сатпаймыз.","consent.allow":"Рұқсат беру","consent.decline":"Бас тарту","consent.settings":"Cookie параметрлері","foot.privacy":"Құпиялық саясаты"},"km":{"consent.title":"ជួយយើងធ្វើឱ្យហ្គេមកាន់តែល្អ","consent.text":"យើងជាស្ទូឌីយោឯករាជ្យដែលមានគ្នាពីរនាក់។ តើយើងអាចរាប់ចំនួនអ្នកចូលមើលដោយប្រើ Google Analytics បានទេ? វាបង្ហាញយើងថាអ្នកចូលចិត្តគំនូរនិងជាន់ណា ដើម្បីឱ្យយើងដឹងថាត្រូវបង្កើតអ្វីបន្ទាប់។ គ្មានការតាមដានដើម្បីផ្សព្វផ្សាយ ហើយយើងមិនលក់អ្វីទាំងអស់។","consent.allow":"អនុញ្ញាត","consent.decline":"បដិសេធ","consent.settings":"ការកំណត់ខូគី","foot.privacy":"គោលការណ៍ឯកជនភាព"},"kn":{"consent.title":"ಆಟವನ್ನು ಇನ್ನಷ್ಟು ಉತ್ತಮಗೊಳಿಸಲು ನಮಗೆ ಸಹಾಯ ಮಾಡಿ","consent.text":"ನಾವು ಇಬ್ಬರ ಇಂಡೀ ಸ್ಟುಡಿಯೋ. Google Analytics ಮೂಲಕ ಭೇಟಿಗಳನ್ನು ಎಣಿಸಬಹುದೇ? ನಿಮಗೆ ಯಾವ ವರ್ಣಚಿತ್ರಗಳು ಮತ್ತು ಮಹಡಿಗಳು ಇಷ್ಟ ಎಂದು ಇದು ತೋರಿಸುತ್ತದೆ, ಹಾಗಾಗಿ ಮುಂದೆ ಏನು ಮಾಡಬೇಕೆಂದು ನಮಗೆ ತಿಳಿಯುತ್ತದೆ. ಜಾಹೀರಾತು ಟ್ರ್ಯಾಕಿಂಗ್ ಇಲ್ಲ, ಏನನ್ನೂ ಮಾರುವುದಿಲ್ಲ.","consent.allow":"ಅನುಮತಿಸು","consent.decline":"ನಿರಾಕರಿಸು","consent.settings":"ಕುಕೀ ಸೆಟ್ಟಿಂಗ್‌ಗಳು","foot.privacy":"ಗೌಪ್ಯತಾ ನೀತಿ"},"ky":{"consent.title":"Оюнду жакшыртууга жардам бер","consent.text":"Биз эки кишилик инди-студиябыз. Келүүлөрдү Google Analytics менен санасак болобу? Ал сага кайсы сүрөттөр менен кабаттар жагарын көрсөтөт, ошондо кийинки жолу эмне жасоону билебиз. Жарнамалык көз салуу жок, эч нерсе сатпайбыз.","consent.allow":"Уруксат берүү","consent.decline":"Баш тартуу","consent.settings":"Cookie жөндөөлөрү","foot.privacy":"Купуялуулук саясаты"},"lo":{"consent.title":"ຊ່ວຍພວກເຮົາເຮັດໃຫ້ເກມດີຂຶ້ນ","consent.text":"ພວກເຮົາເປັນສະຕູດິໂອອິນດີ້ທີ່ມີສອງຄົນ. ພວກເຮົານັບຈຳນວນຜູ້ເຂົ້າຊົມດ້ວຍ Google Analytics ໄດ້ບໍ? ມັນຊ່ວຍໃຫ້ເຫັນວ່າເຈົ້າມັກພາບແຕ້ມແລະຊັ້ນໃດ ເພື່ອໃຫ້ພວກເຮົາຮູ້ວ່າຄວນເຮັດຫຍັງຕໍ່. ບໍ່ມີການຕິດຕາມເພື່ອໂຄສະນາ ແລະ ບໍ່ຂາຍຫຍັງເລີຍ.","consent.allow":"ອະນຸຍາດ","consent.decline":"ປະຕິເສດ","consent.settings":"ການຕັ້ງຄ່າຄຸກກີ້","foot.privacy":"ນະໂຍບາຍຄວາມເປັນສ່ວນຕົວ"},"lt":{"consent.title":"Padėk mums padaryti žaidimą geresnį","consent.text":"Esame dviejų žmonių indie studija. Ar galime skaičiuoti apsilankymus su Google Analytics? Jis parodo, kurie paveikslai ir aukštai tau patinka, ir mes žinome, ką kurti toliau. Jokio reklamos sekimo, nieko neparduodame.","consent.allow":"Leisti","consent.decline":"Atmesti","consent.settings":"Slapukų nustatymai","foot.privacy":"Privatumo politika"},"lv":{"consent.title":"Palīdzi mums padarīt spēli labāku","consent.text":"Esam divu cilvēku indie studija. Vai drīkstam skaitīt apmeklējumus ar Google Analytics? Tas parāda, kuras gleznas un stāvi tev patīk, lai zinām, ko veidot tālāk. Nekādas reklāmas izsekošanas, neko nepārdodam.","consent.allow":"Atļaut","consent.decline":"Noraidīt","consent.settings":"Sīkdatņu iestatījumi","foot.privacy":"Privātuma politika"},"mk":{"consent.title":"Помогни ни да ја направиме играта подобра","consent.text":"Ние сме инди студио од двајца луѓе. Смееме ли да ги броиме посетите со Google Analytics? Така гледаме кои слики и катови ги сакаш и знаеме што да направиме следно. Без рекламно следење, ништо не продаваме.","consent.allow":"Дозволи","consent.decline":"Одбиј","consent.settings":"Поставки за колачиња","foot.privacy":"Политика за приватност"},"ml":{"consent.title":"ഗെയിം കൂടുതൽ മികച്ചതാക്കാൻ ഞങ്ങളെ സഹായിക്കൂ","consent.text":"ഞങ്ങൾ രണ്ടുപേരുള്ള ഒരു ഇൻഡി സ്റ്റുഡിയോയാണ്. Google Analytics ഉപയോഗിച്ച് സന്ദർശനങ്ങൾ എണ്ണാമോ? നിങ്ങൾക്ക് ഏതൊക്കെ ചിത്രങ്ങളും നിലകളും ഇഷ്ടമാണെന്ന് ഇത് കാണിക്കും, അങ്ങനെ അടുത്തതായി എന്ത് ഉണ്ടാക്കണമെന്ന് ഞങ്ങൾക്ക് അറിയാം. പരസ്യ ട്രാക്കിംഗ് ഇല്ല, ഒന്നും വിൽക്കുന്നില്ല.", ,"consent.text":"Vi er et indiestudio med to personer. Kan vi telle besøk med Google Analytics? Det viser oss hvilke malerier og etasjer du elsker, så vi vet hva vi skal lage videre. Ingen annonsesporing, ingenting selges.","consent.allow":"Tillat","consent.decline":"Avslå","consent.settings":"Innstillinger for informasjonskapsler","foot.privacy":"Personvernerklæring"},"ne":{"consent.title":"खेललाई अझ राम्रो बनाउन हामीलाई मद्दत गर","consent.text":"हामी दुई जनाको इन्डी स्टुडियो हौँ। के हामी Google Analytics बाट भ्रमण गन्न सक्छौँ? तिमीलाई कुन चित्र र तल्लाहरू मन पर्छन् भन्ने यसले देखाउँछ, ताकि अब के बनाउने भन्ने हामी जान्न सकौँ। विज्ञापनका लागि ट्र्याकिङ छैन, केही बेचिँदैन।","consent.allow":"अनुमति देऊ","consent.decline":"अस्वीकार गर","consent.settings":"कुकी सेटिङ","foot.privacy":"गोपनीयता नीति"},"om":{"consent.title":"Taphicha fooyyessuuf nu gargaari","consent.text":"Nuti istudiyoo indii nama lamaa dha. Daawwannaa Google Analytics'n lakkaa'uu dandeenyaa? Fakkiiwwanii fi darbiiwwan ati jaallattu nutti agarsiisa, kanaaf itti aanee maal hojjechuu akka qabnu beekna. Hordoffiin beeksisaa hin jiru, homaa hin gurguru.","consent.allow":"Hayyami","consent.decline":"Didi","consent.settings":"Qindaa'ina kuukii","foot.privacy":"Imaammata dhuunfaa"},"or":{"consent.title":"ଖେଳକୁ ଆହୁରି ଭଲ କରିବାରେ ଆମକୁ ସାହାଯ୍ୟ କର","consent.text":"ଆମେ ଦୁଇ ଜଣଙ୍କର ଏକ ଇଣ୍ଡି ଷ୍ଟୁଡିଓ। ଆମେ Google Analytics ସହ ଭିଜିଟ ଗଣିପାରିବୁ କି? ତୁମେ କେଉଁ ଚିତ୍ର ଓ ମହଲା ଭଲ ପାଅ ତାହା ଏହା ଦେଖାଏ, ଯାହା ଫଳରେ ପରେ କ'ଣ ତିଆରି କରିବୁ ଜାଣିପାରିବୁ। ବିଜ୍ଞାପନ ଟ୍ରାକିଂ ନାହିଁ, କିଛି ବିକ୍ରି ହୁଏ ନାହିଁ।","consent.allow":"ଅନୁମତି ଦିଅ","consent.decline":"ପ୍ରତ୍ୟାଖ୍ୟାନ କର","consent.settings":"କୁକି ସେଟିଂସ୍","foot.privacy":"ଗୋପନୀୟତା ନୀତି"},"pa":{"consent.title":"ਗੇਮ ਨੂੰ ਹੋਰ ਵਧੀਆ ਬਣਾਉਣ ਵਿੱਚ ਸਾਡੀ ਮਦਦ ਕਰੋ","consent.text":"ਅਸੀਂ ਦੋ ਜਣਿਆਂ ਦਾ ਇੰਡੀ ਸਟੂਡੀਓ ਹਾਂ। ਕੀ ਅਸੀਂ Google Analytics ਨਾਲ ਵਿਜ਼ਿਟਾਂ ਗਿਣ ਸਕਦੇ ਹਾਂ? ਇਸ ਨਾਲ ਪਤਾ ਲੱਗਦਾ ਹੈ ਕਿ ਤੁਹਾਨੂੰ ਕਿਹੜੀਆਂ ਪੇਂਟਿੰਗਾਂ ਅਤੇ ਮੰਜ਼ਿਲਾਂ ਪਸੰਦ ਹਨ, ਤਾਂ ਜੋ ਅਸੀਂ ਜਾਣ ਸਕੀਏ ਕਿ ਅੱਗੇ ਕੀ ਬਣਾਉਣਾ ਹੈ। ਇਸ਼ਤਿਹਾਰਾਂ ਲਈ ਕੋਈ ਟ੍ਰੈਕਿੰਗ ਨਹੀਂ, ਕੁਝ ਵੀ ਵੇਚਿਆ ਨਹੀਂ ਜਾਂਦਾ।","consent.allow":"ਇਜਾਜ਼ਤ ਦਿਓ","consent.decline":"ਇਨਕਾਰ ਕਰੋ","consent.settings":"ਕੂਕੀ ਸੈਟਿੰਗਾਂ","foot.privacy":"ਪ੍ਰਾਈਵੇਸੀ ਨੀਤੀ"},"ps":{"consent.title":"زموږ سره مرسته وکړه چې لوبه ښه کړو","consent.text":"موږ د دوو کسانو خپلواکه سټوډیو یو. ایا موږ کولای شو لیدنې د Google Analytics په مرسته وشمېرو؟ دا موږ ته ښيي چې تاسو کومې نقاشۍ او پوړونه خوښوئ، تر څو پوه شو چې بل څه جوړ کړو. د اعلاناتو تعقیب نشته، هیڅ شی نه پلورو.","consent.allow":"اجازه ورکړه","consent.decline":"رد کړه","consent.settings":"د کوکي تنظیمات","foot.privacy":"د محرمیت تګلاره"},"ro":{"consent.title":"Ajută-ne să facem jocul mai bun","consent.text":"Suntem un studio indie format din două persoane. Putem număra vizitele cu Google Analytics? Ne arată ce tablouri și etaje îți plac, ca să știm ce să facem mai departe. Fără urmărire pentru reclame, nu vindem nimic.","consent.allow":"Permite","consent.decline":"Refuză","consent.settings":"Setări cookie-uri","foot.privacy":"Politica de confidențialitate"},"si":{"consent.title":"ක්‍රීඩාව වඩා හොඳ කරන්න අපට උදව් කරන්න","consent.text":"අපි දෙදෙනෙකුගෙන් යුත් ඉන්ඩි ස්ටුඩියෝවක්. Google Analytics මගින් නැරඹුම් ගණන් කරන්න පුළුවන්ද? ඔබ ප්‍රිය කරන සිතුවම් සහ මහල් මොනවාදැයි එයින් පෙනෙන නිසා ඊළඟට කුමක් හදන්නදැයි අපි දැනගන්නවා. දැන්වීම් සඳහා සොයා බැලීමක් නැත, කිසිවක් විකුණන්නේ නැත.","consent.allow":"ඉඩ දෙන්න","consent.decline":"ප්‍රතික්ෂේප කරන්න","consent.settings":"කුකී සැකසීම්","foot.privacy":"පෞද්ගලිකත්ව ප්‍රතිපත්තිය"},"sk":{"consent.title":"Pomôž nám spraviť hru lepšou","consent.text":"Sme dvojčlenné indie štúdio. Môžeme počítať návštevy cez Google Analytics? Ukáže nám, ktoré obrazy a poschodia miluješ, takže vieme, čo urobiť ďalej. Žiadne sledovanie pre reklamu, nič nepredávame.","consent.allow":"Povoliť","consent.decline":"Odmietnuť","consent.settings":"Nastavenia cookies","foot.privacy":"Zásady ochrany súkromia"},"sl":{"consent.title":"Pomagaj nam narediti igro boljšo","consent.text":"Smo dvočlansko indie studio. Ali lahko štejemo obiske z Google Analytics? Pokaže nam, katere slike in nadstropja imaš rad, zato vemo, kaj narediti naslednje. Brez sledenja za oglase, ničesar ne prodajamo.","consent.allow":"Dovoli","consent.decline":"Zavrni","consent.settings":"Nastavitve piškotkov","foot.privacy":"Pravilnik o zasebnosti"},"so":{"consent.title":"Naga caawi inaan ciyaarta ka dhigno mid ka wanaagsan","consent.text":"Waxaan nahay istuudiyo indie ah oo laba qof ah. Ma tirin karnaa booqashooyinka anagoo isticmaalaya Google Analytics? Waxay nagu tusinaysaa sawirrada iyo dabaqyada aad jeceshahay, si aan u ogaano waxa xiga ee aan sameyno. Raad-raac xayeysiis ma jiro, waxba ma iibino.","consent.allow":"Oggolow","consent.decline":"Diid","consent.settings":"Dejinta kukiyada","foot.privacy":"Siyaasadda asturnaanta"},"sq":{"consent.title":"Na ndihmo ta bëjmë lojën më të mirë","consent.text":"Jemi një studio indie me dy persona. A mund t'i numërojmë vizitat me Google Analytics? Na tregon cilat piktura dhe kate i do, që të dimë çfarë të bëjmë më pas. Pa gjurmim për reklama, nuk shesim asgjë.","consent.allow":"Lejo","consent.decline":"Refuzo","consent.settings":"Cilësimet e cookies","foot.privacy":"Politika e privatësisë"},"sr":{"consent.title":"Помози нам да игру учинимо бољом","consent.text":"Ми смо инди студио од двоје људи. Смемо ли да бројимо посете преко Google Analytics? Тако видимо које слике и спратове волиш, па знамо шта даље да направимо. Без праћења за огласе, ништа не продајемо.","consent.allow":"Дозволи","consent.decline":"Одбиј","consent.settings":"Подешавања колачића","foot.privacy":"Политика приватности"},"sv":{"consent.title":"Hjälp oss göra spelet bättre","consent.text":"Vi är en indiestudio med två personer. Får vi räkna besök med Google Analytics? Det visar oss vilka målningar och våningar du älskar, så vi vet vad vi ska göra härnäst. Ingen annonsspårning, inget säljs.","consent.allow":"Tillåt","consent.decline":"Avvisa","consent.settings":"Cookieinställningar","foot.privacy":"Integritetspolicy"},"sw":{"consent.title":"Tusaidie kuifanya mchezo kuwa bora","consent.text":"Sisi ni studio huru ya watu wawili. Je, tunaweza kuhesabu ziara kwa Google Analytics? Inatuonyesha michoro na ghorofa unazozipenda, ili tujue tutengeneze nini kinachofuata. Hakuna ufuatiliaji wa matangazo, hatuuzi chochote.","consent.allow":"Ruhusu","consent.decline":"Kataa","consent.settings":"Mipangilio ya vidakuzi","foot.privacy":"Sera ya faragha"},"ta":{"consent.title":"விளையாட்டை இன்னும் சிறப்பாக்க எங்களுக்கு உதவு","consent.text":"நாங்கள் இரண்டு பேர் கொண்ட இண்டி ஸ்டுடியோ. Google Analytics மூலம் வருகைகளை எண்ணலாமா? நீ எந்த ஓவியங்களையும் தளங்களையும் விரும்புகிறாய் என்பதை இது காட்டும், அதனால் அடுத்து என்ன உருவாக்குவது என்று தெரிந்துகொள்வோம். விளம்பரக் கண்காணிப்பு இல்லை, எதுவும் விற்கப்படுவதில்லை.","consent.allow":"அனுமதி","consent.decline":"மறு","consent.settings":"குக்கீ அமைப்புகள்","foot.privacy":"தனியுரிமைக் கொள்கை"},"te":{"consent.title":"గేమ్‌ను మరింత మెరుగుపరచడంలో మాకు సహాయం చేయండి","consent.text":"మేము ఇద్దరు వ్యక్తుల ఇండీ స్టూడియో. Google Analyticsతో సందర్శనలను లెక్కించవచ్చా? మీకు ఏ పెయింటింగ్స్, అంతస్తులు ఇష్టమో ఇది చూపిస్తుంది, అందువల్ల తర్వాత ఏం చేయాలో మాకు తెలుస్తుంది. ప్రకటనల ట్రాకింగ్ లేదు, ఏదీ అమ్మము.","consent.allow":"అనుమతించు","consent.decline":"తిరస్కరించు","consent.settings":"కుకీ సెట్టింగ్‌లు","foot.privacy":"ప్రైవసీ పాలసీ"},"tg":{"consent.title":"Ба мо кумак кун, ки бозиро беҳтар кунем","consent.text":"Мо студияи мустақили ду нафара ҳастем. Оё мо метавонем боздидҳоро бо Google Analytics ҳисоб кунем? Он ба мо нишон медиҳад, ки кадом асарҳо ва ошёнаҳоро дӯст медорӣ, то донем навбатӣ чӣ созем. Пайгирии таблиғотӣ нест, чизеро намефурӯшем.","consent.allow":"Иҷозат додан","consent.decline":"Рад кардан","consent.settings":"Танзимоти куки","foot.privacy":"Сиёсати махфият"},"th":{"consent.title":"ช่วยเราทำให้เกมดียิ่งขึ้น","consent.text":"เราเป็นสตูดิโออินดี้เล็ก ๆ ของสองคน ขออนุญาตนับจำนวนผู้เข้าชมด้วย Google Analytics ได้ไหม มันช่วยให้เรารู้ว่าคุณชอบภาพวาดและชั้นไหน เราจะได้รู้ว่าควรสร้างอ
