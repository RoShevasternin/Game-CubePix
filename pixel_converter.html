
<h2 class="sr-only">Pixel art converter — converts any painting into a numbered CubePix grid</h2>

<div style="padding: 1rem 0; font-family: var(--font-sans);">

  <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 1.25rem; align-items: flex-end;">
    <div>
      <label style="font-size: 12px; color: var(--color-text-secondary); display: block; margin-bottom: 4px;">Grid width</label>
      <div style="display: flex; align-items: center; gap: 6px;">
        <input type="range" id="cols" min="12" max="32" value="20" step="2" style="width: 110px;">
        <span id="colsVal" style="font-size: 13px; font-weight: 500; min-width: 24px;">20</span>
      </div>
    </div>
    <div>
      <label style="font-size: 12px; color: var(--color-text-secondary); display: block; margin-bottom: 4px;">Color levels</label>
      <div style="display: flex; align-items: center; gap: 6px;">
        <input type="range" id="levels" min="3" max="8" value="6" step="1" style="width: 110px;">
        <span id="levelsVal" style="font-size: 13px; font-weight: 500; min-width: 16px;">6</span>
      </div>
    </div>
    <button id="convertBtn" style="height: 36px;">Convert</button>
    <label style="cursor: pointer; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 6px 14px; font-size: 14px; color: var(--color-text-primary); height: 36px; display: flex; align-items: center;">
      Upload image
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </label>
  </div>

  <div id="status" style="font-size: 13px; color: var(--color-text-secondary); margin-bottom: 1rem; min-height: 18px;"></div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.25rem;">
    <div style="background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 12px; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
      <span style="font-size: 12px; color: var(--color-text-secondary);">Original</span>
      <canvas id="srcCanvas" style="max-width: 100%; max-height: 200px; image-rendering: pixelated;"></canvas>
    </div>
    <div style="background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 12px; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
      <span style="font-size: 12px; color: var(--color-text-secondary);">Pixel art (numbered)</span>
      <canvas id="pixelCanvas" style="max-width: 100%; max-height: 200px; image-rendering: pixelated;"></canvas>
    </div>
  </div>

  <div id="paletteSection" style="display: none; margin-bottom: 1.25rem;">
    <p style="font-size: 12px; color: var(--color-text-secondary); margin: 0 0 8px;">Palette</p>
    <div id="palette" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
  </div>

  <div id="codeSection" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <p style="font-size: 12px; color: var(--color-text-secondary); margin: 0;">Grid code for CubePix</p>
      <div style="display: flex; gap: 8px;">
        <button id="copyBtn">Copy grid</button>
        <button id="addToGameBtn">Add to game ↗</button>
      </div>
    </div>
    <pre id="codeOut" style="background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 12px; font-size: 11px; font-family: var(--font-mono); overflow-x: auto; white-space: pre; max-height: 220px; overflow-y: auto; margin: 0;"></pre>
  </div>

  <canvas id="workCanvas" style="display: none;"></canvas>
  <img id="srcImg" crossorigin="anonymous" style="display: none;">
</div>

<script>
const MONA_URL = 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg/402px-Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg';

let currentImage = null;
let lastGrid = null;
let lastCenters = null;

const colsSlider  = document.getElementById('cols');
const levelsSlider= document.getElementById('levels');
const status      = document.getElementById('status');

colsSlider.oninput  = () => document.getElementById('colsVal').textContent  = colsSlider.value;
levelsSlider.oninput= () => document.getElementById('levelsVal').textContent = levelsSlider.value;

document.getElementById('convertBtn').onclick = () => { if (currentImage) convert(currentImage); };

document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  loadImage(URL.createObjectURL(file), file.name);
};

document.getElementById('copyBtn').onclick = () => {
  const code = document.getElementById('codeOut').textContent;
  navigator.clipboard.writeText(code).then(() => {
    document.getElementById('copyBtn').textContent = 'Copied!';
    setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy grid', 1500);
  });
};

document.getElementById('addToGameBtn').onclick = () => {
  if (!lastGrid || !lastCenters) return;
  const gridStr = JSON.stringify(lastGrid);
  const palStr = lastCenters.map((c,i) => `${i+1}:"${rgbToHex(c)}"`).join(', ');
  sendPrompt(`Ось автоматично згенерований grid для Мони Лізи з ${lastGrid[0].length}×${lastGrid.length} пікселів і ${lastCenters.length} кольорів:\n\ngrid: ${gridStr}\npalette: {${palStr}}\n\nДодай це в CubePix як оновлений рівень mona_lisa в Світі 4 Мистецтво. Підбери також glow і dark кольори на основі palette.`);
};

function loadImage(url, name) {
  status.textContent = `Loading ${name}...`;
  const img = document.getElementById('srcImg');
  img.onload = () => {
    currentImage = img;
    status.textContent = `Ready: ${name} (${img.naturalWidth} × ${img.naturalHeight}px)`;
    const srcCanvas = document.getElementById('srcCanvas');
    const MAX = 200;
    const sc = Math.min(MAX / img.naturalWidth, MAX / img.naturalHeight);
    srcCanvas.width  = Math.round(img.naturalWidth  * sc);
    srcCanvas.height = Math.round(img.naturalHeight * sc);
    srcCanvas.getContext('2d').drawImage(img, 0, 0, srcCanvas.width, srcCanvas.height);
    convert(img);
  };
  img.onerror = () => {
    status.textContent = `Could not load (CORS blocked). Please upload an image manually using the button above.`;
  };
  img.src = url;
}

function convert(img) {
  const cols = parseInt(colsSlider.value);
  const rows = Math.round(cols * (img.naturalHeight / img.naturalWidth));
  const k    = parseInt(levelsSlider.value);

  status.textContent = `Converting to ${cols}×${rows} grid with ${k} color levels...`;

  const work = document.getElementById('workCanvas');
  work.width  = cols;
  work.height = rows;
  const ctx = work.getContext('2d');
  ctx.drawImage(img, 0, 0, cols, rows);

  const raw = ctx.getImageData(0, 0, cols, rows).data;
  const pixels = [];
  for (let i = 0; i < rows * cols; i++) {
    pixels.push([raw[i*4], raw[i*4+1], raw[i*4+2]]);
  }

  const centers = kMeans(pixels, k);
  centers.sort((a, b) => brightness(a) - brightness(b));

  const labels = pixels.map(p => {
    let best = 0, bd = Infinity;
    centers.forEach((c, i) => { const d = dist(p, c); if (d < bd) { bd = d; best = i; } });
    return best + 1;
  });

  const grid = [];
  for (let i = 0; i < rows; i++) grid.push(labels.slice(i * cols, (i+1) * cols));

  lastGrid    = grid;
  lastCenters = centers;

  const SCALE = Math.max(2, Math.min(12, Math.floor(220 / Math.max(cols, rows))));
  const px = document.getElementById('pixelCanvas');
  px.width  = cols * SCALE;
  px.height = rows * SCALE;
  const pctx = px.getContext('2d');

  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < cols; j++) {
      const lv = grid[i][j];
      const [r,g,b] = centers[lv-1];
      pctx.fillStyle = `rgb(${r},${g},${b})`;
      pctx.fillRect(j*SCALE, i*SCALE, SCALE, SCALE);
      if (SCALE >= 9) {
        pctx.fillStyle = brightness(centers[lv-1]) > 120 ? '#000000' : '#ffffff';
        pctx.font = `${Math.min(SCALE-2, 8)}px monospace`;
        pctx.textAlign = 'center';
        pctx.textBaseline = 'middle';
        pctx.fillText(lv, j*SCALE + SCALE/2, i*SCALE + SCALE/2);
      }
    }
  }

  const palEl = document.getElementById('palette');
  palEl.innerHTML = '';
  centers.forEach((c, i) => {
    const hex = rgbToHex(c);
    const lbl = ['cream','mid-tone','shadow','deep','dark','darkest','lightest','light'][i] || `level ${i+1}`;
    const el = document.createElement('div');
    el.style.cssText = 'display:flex;align-items:center;gap:6px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:6px;padding:4px 10px;';
    el.innerHTML = `<div style="width:18px;height:18px;border-radius:3px;background:${hex};border:0.5px solid var(--color-border-tertiary);flex-shrink:0;"></div><span style="font-size:12px;font-family:var(--font-mono);color:var(--color-text-primary);">${i+1}: ${hex}</span>`;
    palEl.appendChild(el);
  });
  document.getElementById('paletteSection').style.display = 'block';

  const palCode   = centers.map((c,i) => `${i+1}:"${rgbToHex(c)}"`).join(', ');
  const gridLines = grid.map(row => '    [' + row.join(',') + ']').join(',\n');
  document.getElementById('codeOut').textContent = `mona_lisa: [\n${gridLines}\n  ],\n\n// palette: { ${palCode} }`;
  document.getElementById('codeSection').style.display = 'block';

  status.textContent = `Done. ${cols}×${rows} grid, ${k} colors, ${grid.flat().length} cells.`;
}

function kMeans(pixels, k, iters = 20) {
  const centers = [pixels[Math.floor(Math.random() * pixels.length)].slice()];
  while (centers.length < k) {
    const ds = pixels.map(p => Math.min(...centers.map(c => dist(p, c))));
    const tot = ds.reduce((a,b) => a+b, 0);
    let r = Math.random() * tot;
    for (let i = 0; i < pixels.length; i++) { r -= ds[i]; if (r <= 0) { centers.push(pixels[i].slice()); break; } }
    if (centers.length < k) centers.push(pixels[Math.floor(Math.random()*pixels.length)].slice());
  }
  for (let it = 0; it < iters; it++) {
    const sums = Array.from({length:k}, () => [0,0,0,0]);
    pixels.forEach(p => {
      let best = 0, bd = Infinity;
      centers.forEach((c,i) => { const d = dist(p,c); if (d<bd){bd=d;best=i;} });
      sums[best][0]+=p[0]; sums[best][1]+=p[1]; sums[best][2]+=p[2]; sums[best][3]++;
    });
    centers.forEach((c,i) => {
      if (sums[i][3]>0) { c[0]=Math.round(sums[i][0]/sums[i][3]); c[1]=Math.round(sums[i][1]/sums[i][3]); c[2]=Math.round(sums[i][2]/sums[i][3]); }
    });
  }
  return centers;
}

const dist       = (a,b) => { const dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2]; return dr*dr+dg*dg+db*db; };
const brightness = ([r,g,b]) => 0.299*r + 0.587*g + 0.114*b;
const rgbToHex   = ([r,g,b]) => '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');

loadImage(MONA_URL, 'Mona Lisa');
</script>
